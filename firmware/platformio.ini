[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = bamboo_partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=0
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

[env:bench]
; desk/Pi build: TinyUSB composite CDC+MSC (serial logs + fake stick together)
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:printer]
; printer build: TinyUSB MSC only (printer's USB host sees a plain stick)
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
